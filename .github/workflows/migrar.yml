name: migrar

on:
  push:
    branches: [main]
    paths: ['migrations/**']

permissions:
  contents: read

concurrency:
  group: migracoes-d1-producao
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Confere configuração e prepara binding DB
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'D1_DATABASE_NAME', 'D1_DATABASE_ID']) {
            if (!process.env[name]) throw new Error(`Configure ${name} em Settings > Secrets and variables > Actions.`);
          }
          const config = {
            name: 'site-autentica-o-frank-migracoes',
            compatibility_date: '2026-10-15',
            d1_databases: [{ binding: 'DB', database_name: process.env.D1_DATABASE_NAME,
              database_id: process.env.D1_DATABASE_ID, migrations_dir: 'migrations' }]
          };
          fs.writeFileSync('wrangler.ci.json', JSON.stringify(config, null, 2));
          NODE
      - name: Aplica migrações no D1 remoto
        run: npx --yes wrangler d1 migrations apply DB --remote --config wrangler.ci.json
      - name: Confirma as colunas da tabela notas
        run: npx --yes wrangler d1 execute DB --remote --config wrangler.ci.json --command "PRAGMA table_info(notas)"
