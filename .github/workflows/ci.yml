name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Procura segredos versionados
        shell: bash
        run: |
          # Exclui este arquivo porque ele contém a própria expressão de busca.
          # -l mostra apenas os nomes dos arquivos, nunca o valor encontrado.
          if git grep -IlE "GOCSPX-|client_secret *= *['\"][^'\"]+" -- . ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "::error::Possível segredo no repositório; remova-o e revogue a credencial."
            exit 1
          fi
      - name: Instala SQLite
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Aplica as migrações D1 em um SQLite local
        shell: bash
        run: |
          shopt -s nullglob
          arquivos=(migrations/*.sql)
          if [ "${#arquivos[@]}" -eq 0 ]; then
            echo "::error::Nenhuma migração encontrada."
            exit 1
          fi
          for f in "${arquivos[@]}"; do
            echo "Aplicando $f"
            sqlite3 -bail teste.db < "$f"
          done
          sqlite3 teste.db ".tables"
      - name: Valida HTML
        run: npx --yes htmlhint "**/*.html"
