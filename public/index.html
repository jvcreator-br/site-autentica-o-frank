<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Atividade OAuth</title>
</head>
<body>
  <main>
    <h1>Atividade de autenticação</h1>
    <p id="status">Consultando a sessão...</p>
    <nav aria-label="Opções de login">
      <p><a href="/oauth/login/google">Entrar com Google</a></p>
      <p><a href="/oauth/login/github">Entrar com GitHub</a></p>
    </nav>
    <form method="post" action="/oauth/logout">
      <button type="submit">Sair</button>
    </form>
  </main>
  <script>
    fetch('/api/me', { credentials: 'same-origin' })
      .then(response => response.ok ? response.json() : null)
      .then(user => {
        document.getElementById('status').textContent = user
          ? 'Sessão de ' + (user.email || user.displayName || user.subject) + '.'
          : 'Nenhuma sessão neste navegador.';
      })
      .catch(() => {
        document.getElementById('status').textContent = 'Não foi possível consultar a sessão.';
      });
  </script>
</body>
</html>
