<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/light-bootstrap-dashboard.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
  <title>Entrar | Frank</title>
</head>
<body data-page="login">
  <main class="login-page">
    <section class="card login-card" aria-labelledby="login-title">
      <div class="card-header text-center">
        <span class="login-mark" aria-hidden="true"><i class="nc-icon nc-circle-09"></i></span>
        <p class="card-category">Frank Dashboard</p>
        <h1 class="card-title" id="login-title">Acesse sua conta</h1>
      </div>
      <div class="card-body">
        <p class="text-center text-muted">Entre para acessar o dashboard.</p>
        <div class="login-actions">
          <a class="btn btn-primary btn-fill btn-block" href="/oauth/login/google">Entrar com Google</a>
          <a class="btn btn-dark btn-fill btn-block" href="/oauth/login/github">Entrar com GitHub</a>
        </div>
        <p id="status" class="login-status" role="status" aria-live="polite" aria-busy="true">Consultando sessão…</p>
      </div>
    </section>
  </main>
</body>
</html>
